name: Release

# Publishes a release: builds both platforms from the commit this is started
# on, tags that commit, and attaches the installer and the disk image.
# Started by hand (Actions → Release → Run workflow); nothing publishes on a
# push. The builds are NOT rebuilt here — this calls the very same two
# workflows CI runs, so a release ships exactly what the tested build produces.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0 — becomes the tag (v…) and the version the apps report. Empty: today's date, counting up if there already is a release today."
        type: string
        required: false
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

jobs:
  # Settled before anything is built: the version is stamped INTO the bundles,
  # so it has to be known up front.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - id: pick
      env:
        GIVEN: ${{ inputs.version }}
      run: |
        set -euo pipefail
        exists() { git ls-remote --exit-code --tags origin "refs/tags/v$1" >/dev/null 2>&1; }
        if [ -n "$GIVEN" ]; then
          # An explicit version is taken as given — if that tag exists, say so
          # instead of quietly releasing under a different name.
          if exists "$GIVEN"; then
            echo "A release v$GIVEN already exists." >&2
            exit 1
          fi
          version="$GIVEN"
        else
          # Today's date, counting up for every further release the same day:
          # 2026.10.06, 2026.10.06.2, 2026.10.06.3 …
          base="$(date +%Y.%m.%d)"
          version="$base"
          n=1
          while exists "$version"; do
            n=$((n + 1))
            version="$base.$n"
          done
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Releasing as v$version"

  macos:
    needs: version
    uses: ./.github/workflows/build-mac.yml
    with:
      version: ${{ needs.version.outputs.version }}

  windows:
    needs: version
    uses: ./.github/workflows/build-win.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the release
    steps:
    - uses: actions/checkout@v4

    # The two things a user installs. The .app and the raw Windows bundle
    # stay CI artifacts — they are for inspection, not for handing out.
    - name: Collect the disk image
      uses: actions/download-artifact@v4
      with:
        name: byzanz-capture-macos-dmg
        path: artifacts

    - name: Collect the Windows installer
      uses: actions/download-artifact@v4
      with:
        name: byzanz-capture-windows-installer
        path: artifacts

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        ls -la artifacts
        # `gh release create` creates the tag on this commit as it publishes,
        # so no separate tagging step is needed.
        gh release create "v${{ needs.version.outputs.version }}" \
          --target "$GITHUB_SHA" \
          --title "v${{ needs.version.outputs.version }}" \
          --generate-notes \
          ${{ inputs.prerelease && '--prerelease' || '' }} \
          artifacts/*
