name: Build for macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp into the build (default: date + commit)"
        type: string
        required: false

# Like build-win.yml, this is a thin wrapper: the build environment and the
# build itself live in scripts/mac-setup.sh, so CI and a local macOS build
# stay in lockstep. Do NOT re-list brew packages or pip installs here.
jobs:
  build:
    env:
      BYZANZ_VERSION: ${{ inputs.version }}
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true   # vendor/libgphoto2 — the fork the bundle ships

    - name: Install dependencies (brew)
      run: ./scripts/mac-setup.sh deps

    - name: Set up Python environment
      run: ./scripts/mac-setup.sh venv

    - name: Build libgphoto2 (vendored fork)
      run: ./scripts/mac-setup.sh gphoto2

    - name: Build
      run: ./scripts/mac-setup.sh build

    - name: Smoke test (launch frozen app headless)
      run: ./scripts/mac-setup.sh smoketest

    - name: Build disk image
      run: ./scripts/mac-setup.sh dmg

    - name: Upload app bundle
      if: always()   # keep the bundle for inspection even if the smoke test failed
      uses: actions/upload-artifact@v4
      with:
        name: byzanz-capture-macos-app
        path: dist/byzanz-capture.app

    - name: Upload disk image
      uses: actions/upload-artifact@v4
      with:
        name: byzanz-capture-macos-dmg
        path: dist/*.dmg
